<!DOCTYPE html>
<!-- Jangkau: accessibility fixes, 25 -> 0 failing elements (WCAG 2.x / EN 301 549). neatlogs trace https://app.neatlogs.com/traces/f2f86bd3797d9b2144cdee031a3a694c?orgId=7d30cb27-b8a1-4558-a9bd-862b4c76999c&projectId=a7383f92-712a-4139-a767-58f3245b56cd, prompt jangkau-fixer-system@v1 (production), v8. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Senja Coffee</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fffaf3; color: #3b2a1a; }
  header { background: #6b3e1e; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #f5e6d3; text-decoration: none; margin-left: 16px; }
  .hero { padding: 48px 32px; }
  .hero p { color: #5a4a3a; font-size: 18px; }
  .menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 0 32px; }
  .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px #0002; }
  .card img { width: 100%; height: 140px; object-fit: cover; background: #e8d9c8; }
  .price { color: #6b4423; }
  form { padding: 32px; display: flex; gap: 8px; }
  input { padding: 8px; border: 1px solid #ccc; }
  .icon-btn { width: 40px; height: 40px; background: #6b3e1e; border: 0; border-radius: 50%; }
  footer { padding: 24px 32px; color: #5a4a3a; }
</style>
</head>
<body>
<header>
  <img src="logo.png" width="120" height="32" alt="Senja Coffee logo">
  <nav>
    <a href="#menu">Menu</a>
    <a href="#order">Order</a>
    <a href="#">Location</a>
  </nav>
</header>

<main><div class="hero">
  <h1>Senja Coffee</h1>
  <h2>Local coffee from farmers in Gayo, Toraja and Kintamani</h2>
  <p>Brewed slowly, enjoyed slowly. Open daily, 7 am to 10 pm.</p>
</div>

<div class="menu" id="menu">
  <div class="card">
    <img src="latte.jpg" alt="Palm sugar iced latte">
    <h3>Palm sugar iced latte</h3>
    <p class="price">$2.20</p>
  </div>
  <div class="card">
    <img src="v60.jpg" alt="V60 Gayo coffee">
    <h3>V60 Gayo</h3>
    <p class="price">$2.80</p>
  </div>
  <div class="card">
    <img src="banana.jpg" alt="Fried banana with cheese">
    <h3>Fried banana with cheese</h3>
    <p class="price">$1.80</p>
  </div>
</div>

<form id="order">
  <input type="text" placeholder="Name">
  <input type="tel" placeholder="WhatsApp number">
  <label for="coffee-select">Choose a drink:</label>
  <select id="coffee-select">
    <option>Palm sugar iced latte</option>
    <option>V60 Gayo</option>
  </select>
  <button class="icon-btn" aria-label="Submit order"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 8h12M9 3l5 5-5 5" stroke="#fff" fill="none"/></svg></button>
</form>
</main>

<footer>
  <p>© 2026 Senja Coffee · 12 Braga Street, Bandung</p>
  <a href="https://instagram.com"><img src="ig.png" width="24" height="24" alt="Instagram"></a>
</footer>
</body>
</html>
