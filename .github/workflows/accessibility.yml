name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The landing page must stay clean: any serious issue fails the build.
      - name: Landing page
        uses: ./
        with:
          pages: site/index.html
          sarif: site.sarif
          fail-on: serious
          wait: "3500"  # the hero headline animates from failing to passing contrast
      # The deployed site is crawled by deployment.yml once Vercel reports the deploy finished.
      # The demo pages are broken on purpose; report them to code scanning without failing.
      - name: Demo pages
        if: always()
        uses: ./
        with:
          pages: demo_site/index.html demo_site/shop.html
          sarif: demo.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: demo.sarif
          category: jangkau-demo
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: site.sarif
          category: jangkau-site
