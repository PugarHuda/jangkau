<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Kopi Senja - Kopi Lokal Indonesia</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fffaf3; color: #3b2a1a; }
  header { background: #6b3e1e; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #f5e6d3; text-decoration: none; margin-left: 16px; }
  .hero { padding: 48px 32px; }
  .hero p { color: #5a4a3a; font-size: 18px; }
  .menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 0 32px; }
  .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px #0002; }
  .card img { width: 100%; height: 140px; object-fit: cover; background: #e8d9c8; }
  .price { color: #6b4423; }
  form { padding: 32px; display: flex; gap: 8px; }
  input { padding: 8px; border: 1px solid #ccc; }
  .icon-btn { width: 40px; height: 40px; background: #6b3e1e; border: 0; border-radius: 50%; }
  footer { padding: 24px 32px; color: #5a4a3a; }
</style>
</head>
<body>
<header>
  <img src="logo.png" width="120" height="32" alt="Kopi Senja logo">
  <nav>
    <a href="#menu">Menu</a>
    <a href="#pesan">Pesan</a>
    <a href="#">Lokasi</a>
  </nav>
</header>

<main><div class="hero">
  <h1>Kopi Senja</h1>
  <h2>Kopi lokal dari petani Gayo, Toraja, dan Kintamani</h2>
  <p>Diseduh pelan, dinikmati santai. Buka setiap hari 07.00 sampai 22.00.</p>
</div>

<div class="menu" id="menu">
  <div class="card">
    <img src="kopi-susu.jpg" alt="Kopi Susu Gula Aren">
    <h3>Kopi Susu Gula Aren</h3>
    <p class="price">Rp 22.000</p>
  </div>
  <div class="card">
    <img src="v60.jpg" alt="V60 Gayo">
    <h3>V60 Gayo</h3>
    <p class="price">Rp 28.000</p>
  </div>
  <div class="card">
    <img src="pisang.jpg" alt="Pisang Goreng Keju">
    <h3>Pisang Goreng Keju</h3>
    <p class="price">Rp 18.000</p>
  </div>
</div>

<section id="pesan" aria-label="Formulir Pemesanan">
<form>
  <input type="text" placeholder="Nama">
  <input type="tel" placeholder="Nomor WhatsApp">
  <label for="minuman">Pilih minuman</label>
  <select id="minuman">
    <option>Kopi Susu Gula Aren</option>
    <option>V60 Gayo</option>
  </select>
  <button class="icon-btn" aria-label="Kirim pesanan"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 8h12M9 3l5 5-5 5" stroke="#fff" fill="none"/></svg></button>
</form>
</section>
</main>

<footer>
  <p>© 2026 Kopi Senja · Jl. Braga No. 12, Bandung</p>
  <a href="https://instagram.com"><img src="ig.png" width="24" height="24" alt="Instagram"></a>
</footer>
</body>
</html>
